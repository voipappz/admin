version: 2.1

# Simple, deterministic pipeline (pattern borrowed from nimbus-admin):
#   install-deps → test-quality (lint + Vitest) + test-portal (ExUnit) → build-docker
# Playwright is intentionally NOT run here — browser downloads stall on the
# CI runners and the suite needs a live backend. E2E is run against a live
# deploy from a feature branch / locally, not in the main pipeline.

jobs:
  install-deps:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v2-node-deps-{{ checksum "package-lock.json" }}

  test-quality:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-node-deps-{{ checksum "package-lock.json" }}
            - v2-node-deps-
      - run:
          name: Run linter
          command: npm run lint
      - run:
          name: Run unit tests (Vitest)
          command: npm run test:run

  test-portal:
    docker:
      - image: hexpm/elixir:1.19.5-erlang-27.3.4-debian-trixie-20260610-slim
      # The portal's suite needs a real Postgres; same major as production.
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
    environment:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: 5432
    steps:
      - checkout
      - run:
          name: Run the Elixir portal suite
          command: |
            apt-get update && apt-get install -y --no-install-recommends git build-essential
            mix local.hex --force && mix local.rebar --force
            cd connectix
            mix deps.get
            mix compile --warnings-as-errors
            mix test
          no_output_timeout: 15m

  build-docker:
    docker:
      - image: cimg/base:24.04
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            echo "🐳 Building Docker image"
            TAG="release-${CIRCLE_BUILD_NUM}"
            docker build \
              -f Dockerfile.production \
              -t nirlevi/telecom-sales-app:${TAG} .
            echo "✅ Docker images created:"
            echo "- nirlevi/telecom-sales-app:${TAG}"
      - run:
          name: Build and push Docker image
          command: |
            docker login -u nirlevi -p $DOCKER_PASS

            RELEASE_TAG="nirlevi/telecom-sales-app:release-${CIRCLE_BUILD_NUM}"
            LATEST_TAG="nirlevi/telecom-sales-app:latest"

            echo "🏷️ Building with tags:"
            echo "  Release: ${RELEASE_TAG}"
            echo "  Latest: ${LATEST_TAG}"

            # Build with cache and parallel layers
            docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              --cache-from ${LATEST_TAG} \
              --tag ${RELEASE_TAG} \
              --tag ${LATEST_TAG} \
              -f Dockerfile.production \
              .

            docker push ${RELEASE_TAG} &
            docker push ${LATEST_TAG} &
            wait
      - run: rm -rf Dockerfile.production

workflows:
  version: 2

  # Main CI/CD workflow - production branches only
  ci-cd:
    jobs:
      - install-deps:
          filters:
            branches:
              only:
                - main
                - master
      - test-portal:
          filters:
            branches:
              only:
                - main
                - master
      - test-quality:
          requires:
            - install-deps
          filters:
            branches:
              only:
                - main
                - master
      - build-docker:
          requires:
            - test-quality
            - test-portal
          filters:
            branches:
              only:
                - main
                - master

  # Feature branch workflow - lighter testing
  feature-testing:
    jobs:
      - install-deps:
          filters:
            branches:
              only:
                - free-tel
                - /^feature.*/
                - /^fix.*/
                - /^dev-.*/
                - /^va-.*/
      - test-portal:
          filters:
            branches:
              only:
                - free-tel
                - /^feature.*/
                - /^fix.*/
                - /^dev-.*/
                - /^va-.*/
      - test-quality:
          requires:
            - install-deps
          filters:
            branches:
              only:
                - free-tel
                - /^feature.*/
                - /^fix.*/
                - /^dev-.*/
                - /^va-.*/
      - build-docker:
          requires:
            - test-quality
            - test-portal
          filters:
            branches:
              only:
                - free-tel
                - /^feature.*/
                - /^fix.*/
                - /^dev-.*/
                - /^va-.*/
