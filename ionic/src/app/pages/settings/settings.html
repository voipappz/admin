      <ion-content class="ion-padding">
        <ion-list>
          <ion-item>
            <ion-label position="stacked">{{user.email}}</ion-label>
            {{user.first_name +' '+user.last_name }}
          </ion-item>
          <ion-item>
            <ion-label position="stacked">{{'SETTINGS.FIELDS.LANGUAGE'|translate}}</ion-label>
            <ion-select interface="popover" [value]="user.language" (ionChange)="languageChanged($event)">
              <ion-select-option value="he">עברית</ion-select-option>
              <ion-select-option value="en">English</ion-select-option>
            </ion-select>
          </ion-item>
          <ion-item button detail="true" (click)="goTo('time_condition')">
              <ion-label>{{'SETTINGS.FIELDS.TIME_CONDITION'|translate}}</ion-label>
          </ion-item>
          <!-- connectix server (the app's one backend). Blank = same-origin
               (web) / dev default. Packaged Electron/Android builds set the
               cloud URL here. Saved to localStorage; applies on reload. -->
          <ion-item>
            <ion-label position="stacked">{{'SETTINGS.FIELDS.SERVER'|translate}}</ion-label>
            <ion-input
              type="url"
              [value]="serverUrl"
              placeholder="https://cloud.example.com"
              (ionChange)="serverChanged($event)">
            </ion-input>
          </ion-item>
      </ion-list>
      </ion-content>
