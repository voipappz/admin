

<ion-header>
  <ion-toolbar>
    <!-- <ion-buttons slot="start">
    <ion-menu-button></ion-menu-button>
  </ion-buttons> -->
  <ion-buttons slot="start" class="header-logo">
    <div >
      <img src="assets/img/logo.png" alt="Advanced Communication logo">
    </div>
  </ion-buttons>
  <ion-grid>
    <ion-row>
      <ion-col size="4">
        <ion-title>Room</ion-title>
      </ion-col>
      <ion-col size="auto" >
        <p class="call-data">
          {{header_title}} {{room.call_timer_string}}
        </p>
      </ion-col>
    </ion-row>
  </ion-grid>
  <ion-buttons slot="end">
    @if (active_call) {
      <ion-tab-button (click)="endCall()">
        <ion-icon name="log-out-outline"></ion-icon>
        <ion-label>End call</ion-label>
      </ion-tab-button>
    }
  </ion-buttons>
</ion-toolbar>
</ion-header>
<ion-content >
  <!-- <div class="contact-background">
  <img [src]="contact?.profilePic" [alt]="contact?.name">
  <h2>{{contact?.name}}</h2>
</div> -->

<div class="ion-padding">
  @if (!dataAvailable) {
    <div class="msg-box">
      {{message}}
    </div>
  }
  @if (dataAvailable && type=='video') {
    <janus-videoroom
      [wsUrl]='wsUrl'
      [httpUrl]='httpUrl'
      [roomId]='roomId'
      [isMuted]='isMuted'
      [userName]="guestId"
      [devices]='devices'
      [pin]='pin' [role]="'publisher'"
      (janusError)='onError($event)'
      (publishers)="onPublish($event)"
    ></janus-videoroom>
  }
  <div [hidden]="!(dataAvailable && type=='voice')">
    <audio #audio controls autoplay style="display:none"></audio>
    <div class="audio-call">
      @if (!audio_available) {
        <i class="fa fa-spinner fa-spin" style="font-size:24px"></i>
      }
      @if (audio_available) {
        <i  class="fa fa-microphone" aria-hidden="true"></i>
      }
    </div>
    <!-- <janus-audioroom
    [wsUrl]='wsUrl'
    [httpUrl]='httpUrl'
    [roomId]='roomId'
    [isMuted]='isMuted'
    [userName]="'UserA'"
    [devices]='devices'
    [pin]='pin' [role]="'publisher'"
    (janusError)='onError($event)'
    (publishers)="onPublish($event)"
  ></janus-audioroom> -->
</div>


</div>

</ion-content>
