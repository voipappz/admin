<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8">
  <title>Connectix</title>

  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="theme-color" content="#387ef5">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <base href="/">

  <link rel="icon" type="image/x-icon" href=""><!-- href="assets/img/logo.png"-->
  <link rel="apple-touch-icon" href=""><!-- href="assets/img/logo.png"-->
  <link rel="manifest" href="manifest.json">

  <script src="assets/font_awesome_kit.js" crossorigin="anonymous"></script>
  <script src="assets/config/main.js"></script>
</head>

<body>

  <app-root>
    <!-- Replaced by Angular when app loads -->
    <style>
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e0e0e0;
        border-top-color: #3880ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      .app-loading p {
        margin-top: 16px;
        color: #666;
        font-size: 14px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div class="app-loading">
      <div class="spinner"></div>
      <p id="loading-text">Loading...</p>
    </div>
    <script>
      (function() {
        var lang = localStorage.getItem('language');
        var text = document.getElementById('loading-text');
        if (text && lang === 'he') {
          text.textContent = 'טוען...';
          document.documentElement.dir = 'rtl';
        }
      })();
    </script>
  </app-root>

  <!-- Replace the API key with your own, see:
    https://developers.google.com/maps/documentation/javascript/get-api-key -->

  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
