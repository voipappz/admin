# The dev cockpit: one screen that answers "is it up, is it receiving events,
# and what is it saying" without three terminals and a remembered RPC.
#
# `make tmux` starts it. Ctrl-b d detaches and leaves it running; Ctrl-b Q quits.
name: connectix
root: <%= ENV["PWD"] %>

windows:
  - main:
      layout: tiled
      panes:
        # The portal: the origin, and the only place cable and event problems
        # are visible as they happen.
        - docker compose logs -f elixir
        # Vite, so a frontend failure is not mistaken for a backend one.
        - docker compose logs -f react-app
        # The question `verify` could never answer, on a loop: cable
        # subscriptions confirmed, and whether the store is actually growing.
        - watch -n 10 -c make health
  - shell:
      root: <%= ENV["PWD"] %>
      panes:
        - # a plain shell, for `make iex`, `make test`, anything
