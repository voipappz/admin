services:
  db:
    image: postgres:17-alpine
    container_name: agents_demo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Bound to loopback only. Override the host port with PGPORT when 5432 is
    # already taken by another project's database.
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Public HTTPS tunnel to the locally-running Phoenix server, so external
  # webhooks (WhatsApp Cloud API) can reach it. Opt-in:
  #
  #   docker compose --profile tunnel up -d
  #   docker compose logs ngrok      # shows the public https://...ngrok URL
  #
  # Host networking because the target (`mix phx.server`) runs on the host, not
  # in compose, and because it exposes ngrok's request inspector on :4040
  # without needing a published port.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: agents_demo_ngrok
    profiles: ["tunnel"]
    restart: unless-stopped
    network_mode: host
    environment:
      # Set NGROK_AUTHTOKEN in .env — get one at dashboard.ngrok.com
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http ${PHX_PORT:-4000} --log stdout

volumes:
  pgdata:
