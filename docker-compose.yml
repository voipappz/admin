# Core services (react-app + elixir + chrome-ext) have NO profile, so a plain
#   docker compose up -d        (or: make up)
# starts ONLY them. Everything else is behind a profile and is never built or
# started by a default `up`/`build` — so a heavy/optional build (e.g. the
# `production` image) failing can never break the core dev stack. Opt in with:
#   docker compose --profile tools up -d claude
#   docker compose --profile prod  build production
services:
  # Claude AI CLI (dev shell). Opt-in: --profile tools
  claude:
    profiles: ["tools"]
    build: .
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
      - path: .mcp.env
        required: false   # generated by make dev/up; token stays out of Vite
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      NODE_ENV: development
      TERM: xterm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}  # each dev sets their own key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - "seccomp=unconfined"
    command: sleep infinity

  # React + Vite development server (CORE — always started by `up`)
  react-app:
    security_opt:
      - "seccomp=unconfined"
    image: node:24.10.0
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    ports:
      - "4200:4200"
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
    environment:
      NODE_ENV: development
      TERM: xterm
      # Every same-origin browser request enters the Elixir portal. It forwards
      # /api, /auth and /tasks to PORTAL_ENGINE_URL, serves /ws/events, and holds
      # the cable connection. The portal uses host networking, so Vite reaches
      # it via the host gateway.
      VITE_PORTAL_TARGET: ${VITE_PORTAL_TARGET:-http://host.docker.internal:4001}
      # Offline mock login passthrough (see CLAUDE.md) — lets `make test` run
      # the E2E suite against the dev stack: VITE_MOCK_LOGIN=1 make up
      VITE_MOCK_LOGIN: ${VITE_MOCK_LOGIN:-}
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    command: >
      bash -c "
        echo 'Installing dependencies...' &&
        npm install &&
        echo 'Starting Vite development server...' &&
        npm run dev -- --host 0.0.0.0 --port 4200
      "

  # Production build test. Opt-in: --profile test
  test-build:
    profiles: ["test"]
    image: node:lts
    user: "node"
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/home/node/.gitconfig:ro
      - ~/.ssh:/home/node/.ssh:ro
    environment:
      NODE_ENV: production
      TERM: xterm
    command: >
      bash -c "
        echo '🔧 Testing production build...' &&
        npm install &&
        echo '🚀 Building production bundle...' &&
        npm run build &&
        echo '✅ Build completed successfully!' &&
        ls -la dist/
      "

  # The Chrome extension (chrome/) — the Angular popup plus the MV3 background
  # worker. CORE, because it is a client of the portal beside it: it posts
  # /auth/user_login to :4001 and opens its socket on :4001/ws/events, so a
  # stack without it is missing the thing those two surfaces exist for.
  #
  # NOTHING IS SERVED, and that is not an omission. Chrome loads an extension
  # from a DIRECTORY on disk, never over HTTP, so the artefact is
  # chrome/angular/dist on the host mount and this container's whole job is to
  # keep it fresh (`npm run watch` = ng build --watch + webpack -w). Load it
  # once with "Load unpacked"; after that a popup edit needs nothing and a
  # background/content-script edit needs the reload button in
  # chrome://extensions. There is no port to point a browser at.
  #
  # NODE 20, NOT the 24 react-app runs. Angular 11 + webpack 4 need
  # --openssl-legacy-provider (already inside package.json's scripts) and do not
  # build on current Node even with it.
  chrome-ext:
    image: node:20
    # The invoking user, so angular/dist lands HOST-owned. Everything this
    # container produces is read by Chrome and rewritten by hand — `npm run
    # build` on the host, the e2e global-setup, a plain rm — and root-owned
    # output makes all three fail with EACCES inside a directory the developer
    # appears to own. UID/GID are not exported by a shell, so the Makefile
    # passes them; 1000 is the default a Linux desktop user actually has.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./chrome:/app
      # Its own volume. The extension has its OWN package.json and a ~650MB
      # node_modules that shares node_modules_cache with nothing — the SPA's
      # tree would overwrite it and neither build would resolve.
      - chrome_node_modules:/app/node_modules
    # `npm ci` only on a cold volume: it deletes node_modules first, so running
    # it on every start would spend two minutes rebuilding an identical tree
    # before the watcher that is the point of this container ever begins.
    command: >
      bash -c "
        [ -x node_modules/.bin/ng ] || npm ci --legacy-peer-deps --no-audit --no-fund;
        npm run watch
      "

  # The extension's popup as an ordinary web page, on :4300.
  #
  # Same Angular app, served by `ng serve` instead of packed into an extension,
  # so the UI can be iterated on in a normal tab with hot reload — no
  # rebuild → chrome://extensions → reload loop. `chrome.*` does not exist
  # there, which is what `angular/src/app/providers/chrome-shim.ts` stands in
  # for; it is self-installing and inert inside a real extension.
  #
  # NOT a replacement for chrome-ext beside it. This serves a page; that one
  # keeps angular/dist built, which is the only thing Chrome can load unpacked.
  # The background service worker and content script only exist in the packed
  # form, so realtime and screen pops are the extension's job, not this one's.
  chrome-web:
    image: node:20
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./chrome:/app
      - chrome_node_modules:/app/node_modules
    ports:
      - "4300:4300"
    command: >
      bash -c "
        [ -x node_modules/.bin/ng ] || npm ci --legacy-peer-deps --no-audit --no-fund;
        npm run serve
      "

  # The Elixir portal — the origin everything else points at. It serves the SPA
  # and /ws/events, verifies tokens over NATS, holds ONE cable connection and
  # fans out over PubSub, and forwards the mothership's own routes (/auth,
  # /api/, /tasks/) upstream so it is a complete origin on its own.
  #
  # DEV STAGE, MOUNTED SOURCE. `target: dev` stops at the toolchain and runs
  # `mix phx.server` over ./agents_demo, so an edit reloads. The release stages
  # above are what ships; this one is what you type against.
  elixir:
    build:
      context: ./agents_demo
      target: dev
    restart: unless-stopped
    # Host networking because cable (:4100), NATS (:4222) and Postgres (:5432)
    # are all published on the host's loopback,
    # and a bridged container cannot see 127.0.0.1.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORTAL_PORT:-4001}
      # Where the SPA's built assets live. Vite serves them on :4200 during
      # development; this is the fallback that makes :4001 a complete origin
      # on its own — the extension logs in against it with no Vite running.
      SPA_ROOT: /spa
      # The API. /auth, /api/ and /tasks/ are forwarded here.
      #
      # DELIBERATELY NOT `${ENGINE_URL:-${MOTHERSHIP_URL:-...}}`. Compose
      # interpolates from .env, where MOTHERSHIP_URL is the TENANT knob and is
      # normally the cloud — so that chain silently pointed this container at
      # production while the cable and the broker beside it stayed local. The
      # symptom was a login that failed for a user who exists locally, which
      # reads as broken auth rather than as the wrong host.
      #
      # This stack is only coherent when the API, the cable and the broker are
      # the same three local processes, so local is the default and one
      # explicit variable moves it.
      ENGINE_URL: ${PORTAL_ENGINE_URL:-http://127.0.0.1:5000}
      # The LISTEN half: one upstream cable connection for the whole app.
      CABLE_URL: ${PORTAL_CABLE_URL:-ws://127.0.0.1:${CABLE_PORT:-4100}/cable}
      # Mints the cable credential instead of forwarding the browser's token —
      # cable is then handed a statement this app makes about an identity the
      # node already verified, carrying the uuid and nothing else. Unset, the
      # caller's own token is forwarded, which also works. `make dev` supplies
      # this from the API container, the same value the cable verifies with.
      CABLE_SECRET_KEY: ${SECRET_KEY:-}
      # Extra `state.<scope>.<id>` streams the ONE application connection
      # subscribes to purely so their frames land in the DuckDB event store —
      # `scope:id`, comma-separated. Cable has no firehose: `CallEvents` is
      # node-wide, but everything else lives on `state.<scope>.<id>` and
      # StateChannel requires both halves, so an unnamed stream is an unwatched
      # one. Empty here means the connection carries what it always did.
      EVENT_STREAMS: ${EVENT_STREAMS:-}
      # Log shipping to InfluxDB 3 — the SAME four names the node reads, so one
      # .env configures both. Empty unless set, and empty means "not
      # configured": no handler is installed and nothing is posted. The console
      # log is untouched either way; this is an addition for querying.
      # Host-networked, so the compose default `influxdb` resolves to nothing
      # here — point it at 127.0.0.1 to use the API stack's InfluxDB.
      VA_INFLUXDB_HOST: ${VA_INFLUXDB_HOST:-}
      VA_INFLUXDB_PORT: ${VA_INFLUXDB_PORT:-}
      VA_INFLUXDB_DATABASE: ${VA_INFLUXDB_DATABASE:-}
      VA_MONITOR_TOKEN: ${VA_MONITOR_TOKEN:-}
    volumes:
      - ./agents_demo:/app
      # The built SPA, read-only: the server has no reason to write into it.
      - ./dist:/spa:ro
      # Named, so a recreate does not throw away a full compile — and so the
      # host's own _build/deps (built by a different OTP on a different libc)
      # never leak into the container.
      - elixir_build:/app/_build
      - elixir_deps:/app/deps

  # Drives the app on the host network (make up / make dev must be running,
  # or point PLAYWRIGHT_BASE_URL at any deployed origin).
  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    network_mode: host
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://localhost:4200}
    command: >
      bash -c "
        npm install --loglevel=error --no-audit --no-fund &&
        npx playwright test
      "

  # Production image (build + run). Opt-in: --profile prod
  # Heavy build (Vite + an Elixir release). Behind a profile so a build failure
  # can never break the core dev stack — it is only built/run when you ask.
  production:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.production
    # One process serves everything on PORT: the SPA out of /app/dist, the
    # forwarded /auth + /api routes, and /ws/events — the same process Kamal
    # runs in prod (config/deploy.yml, app_port 3000).
    ports:
      - "8000:3000"
    environment:
      PORT: 3000
      # The API. Forwarded routes go here; Cable verifies user tokens and
      # carries realtime events, so Elixir holds no direct NATS connection.
      ENGINE_URL: ${ENGINE_URL:-${MOTHERSHIP_URL:-https://cloud.voipappz.io}}
      CABLE_URL: ${CABLE_URL:-}
      CABLE_SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      DATABASE_URL: ${DATABASE_URL:-}
    # No container healthcheck: the image has no curl (in prod, kamal-proxy
    # probes /health/alive externally — config/deploy.yml). Verify locally:
    #   curl localhost:8000/health/alive

volumes:
  elixir_build:
  elixir_deps:
  node_modules_cache:
  chrome_node_modules:
