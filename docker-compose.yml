# The elixir service has NO profile, so a plain
#   docker compose up -d        (or: make up)
# starts it. Everything else is behind a profile and is never built or
# started by a default `up`/`build` — so a heavy/optional build (e.g. the
# `production` image) failing can never break the core dev stack. Opt in with:
#   docker compose --profile tools up -d claude
#   docker compose --profile prod  build production
services:
  # Claude AI CLI (dev shell). Opt-in: --profile tools
  claude:
    profiles: ["tools"]
    build: .
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
      - path: .mcp.env
        required: false   # generated by make dev/up
    working_dir: /app
    volumes:
      - .:/app
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      NODE_ENV: development
      TERM: xterm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}  # each dev sets their own key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - "seccomp=unconfined"
    command: sleep infinity

  # The Elixir portal — the origin, and now the whole app. It serves the
  # LiveView UI and /ws/events, verifies tokens itself, consumes the switch's
  # events over its Event Socket, and forwards the mothership's own routes
  # (/auth, /api/, /tasks/) upstream so it is a complete origin on its own. No second runtime beside it: the React/Vite/Node frontend this repo
  # used to ship is gone — connectix/ is a pure-BEAM app.
  #
  # DEV STAGE, MOUNTED SOURCE. `target: dev` stops at the toolchain and runs
  # `mix phx.server` over ./connectix, so an edit reloads. The release stages
  # above are what ships; this one is what you type against.
  elixir:
    build:
      context: ./connectix
      target: dev
    restart: unless-stopped
    # Host networking so the portal's own SIP/RTP sockets and anything a
    # developer runs on the host's loopback are reachable as 127.0.0.1.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORTAL_PORT:-4001}
      # The API. /auth, /api/ and /tasks/ are forwarded here.
      #
      # DELIBERATELY NOT `${ENGINE_URL:-${MOTHERSHIP_URL:-...}}`. Compose
      # interpolates from .env, where MOTHERSHIP_URL is the TENANT knob and is
      # normally the cloud — so that chain silently pointed this container at
      # production while the cable and the broker beside it stayed local. The
      # symptom was a login that failed for a user who exists locally, which
      # reads as broken auth rather than as the wrong host.
      #
      # This stack is only coherent when the API, the cable and the broker are
      # the same three local processes, so local is the default and one
      # explicit variable moves it.
      ENGINE_URL: ${PORTAL_ENGINE_URL:-http://127.0.0.1:5000}
      # THE EVENT TRANSPORT: the switch itself, over its Event Socket. WHERE
      # it is lives in the mounted rule file (`freeswitch.host`); the
      # credential is named there and stored here.
      FREESWITCH_ESL_PASSWORD: ${FREESWITCH_ESL_PASSWORD:-}
      # Verifies the user tokens the browser presents. The SAME secret the API
      # signs them with, so the portal checks the signature itself instead of
      # asking anyone. Unset, every socket upgrade is refused and the log says
      # why.
      SECRET_KEY: ${SECRET_KEY:-}
      # The password the agents in priv/pocketflow/screen_pop.yaml sign in
      # with. That file names it and never holds it: a password committed once
      # stays in the history after the file stops carrying it.
      AGENT_PASSWORD: ${AGENT_PASSWORD:-}
      # Log shipping to InfluxDB 3 — the SAME four names the node reads, so one
      # .env configures both. Empty unless set, and empty means "not
      # configured": no handler is installed and nothing is posted. The console
      # log is untouched either way; this is an addition for querying.
      # Host-networked, so the compose default `influxdb` resolves to nothing
      # here — point it at 127.0.0.1 to use the API stack's InfluxDB.
      VA_INFLUXDB_HOST: ${VA_INFLUXDB_HOST:-}
      VA_INFLUXDB_PORT: ${VA_INFLUXDB_PORT:-}
      VA_INFLUXDB_DATABASE: ${VA_INFLUXDB_DATABASE:-}
      VA_MONITOR_TOKEN: ${VA_MONITOR_TOKEN:-}
      # Makes Mnesia a database rather than a cache. `Connectix.Mnesia.persist?/0`
      # counts ONLY an explicit MNESIA_DIR — defaulting a path would blur
      # "configured to persist" with "happens to have somewhere to write", so
      # unset means `ram_copies` and every conversation, message, bot and user
      # dies with the container. That is what was happening: 13 restarts, and
      # each one silently emptied the store while the boot log announced a
      # directory it was not using.
      #
      # Under the `./connectix:/app` bind mount below, so it lands in
      # `connectix/user_files/mnesia` on the host and outlives `docker compose
      # up --force-recreate`. `user_files/` is already gitignored.
      #
      # The test suite is unaffected: it runs unnamed (`nonode@nohost`), and
      # `storage_type/0` forces `ram_copies` for an unnamed node regardless of
      # this variable, so tests never touch this schema.
      MNESIA_DIR: ${MNESIA_DIR:-/app/user_files/mnesia}
    volumes:
      - ./connectix:/app
      # Named, so a recreate does not throw away a full compile — and so the
      # host's own _build/deps (built by a different OTP on a different libc)
      # never leak into the container.
      - elixir_build:/app/_build
      - elixir_deps:/app/deps
      # THE CUSTOMER'S SCREEN-POP RULE, mounted where the portal looks for it
      # in production too. The shared policy (which events pop) is in
      # priv/pocketflow/screen_pop.yaml inside the image; this file is one
      # site's subjects, agents and CRM URL. Change the left-hand side to run
      # the local stack as a different customer. Not an env var: the file that
      # is mounted IS the customer.
      - ./connectix/priv/pocketflow/customers/connectix.yaml:/rules/screen_pop.yaml:ro

  # SIPp — the SIP test peer, in its own container. Opt-in: --profile sipp,
  # or `make sipp`.
  #
  # The same thing the kamal accessory runs (config/deploy.connectix.yml), so
  # what you test against locally is what is deployed.
  #
  # IT ANSWERS, IT DOES NOT CALL. A long-running SIPp is a UAS: it waits on
  # 5060 and answers whatever dials it, which is what the portal's phone needs
  # to call. Placing calls is a one-shot instead — see `make sipp-uac`.
  #
  # NOT IN THE PORTAL IMAGE, deliberately: this can place and answer SIP calls,
  # and the portal is a web app.
  #
  # Host networking like everything else here, so the portal's SIP socket and
  # its RTP reach it on 127.0.0.1 without a published port.
  sipp:
    profiles: ["sipp"]
    build: ./sipp
    network_mode: host
    command: ["-sn", "uas", "-p", "${SIPP_PORT:-5060}", "-nostdin"]
    restart: unless-stopped

  # Production image (build + run). Opt-in: --profile prod
  # Behind a profile so a build failure can never break the core dev stack —
  # it is only built/run when you ask.

volumes:
  elixir_build:
  elixir_deps:
