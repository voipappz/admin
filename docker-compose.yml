# Core services (react-app + elixir + chrome-ext) have NO profile, so a plain
#   docker compose up -d        (or: make up)
# starts ONLY them. Everything else is behind a profile and is never built or
# started by a default `up`/`build` — so a heavy/optional build (e.g. the
# `production` image) failing can never break the core dev stack. Opt in with:
#   docker compose --profile tools up -d claude
#   docker compose --profile prod  build production
services:
  # Claude AI CLI (dev shell). Opt-in: --profile tools
  claude:
    profiles: ["tools"]
    build: .
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
      - path: .mcp.env
        required: false   # generated by make dev/up; token stays out of Vite
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      NODE_ENV: development
      TERM: xterm
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}  # each dev sets their own key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - "seccomp=unconfined"
    command: sleep infinity

  # React + Vite development server (CORE — always started by `up`)
  react-app:
    security_opt:
      - "seccomp=unconfined"
    image: node:24.10.0
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    ports:
      - "4200:4200"
    env_file:
      - path: .env
        required: false   # template: `make up` works before .env exists
    environment:
      NODE_ENV: development
      TERM: xterm
      # Every same-origin browser request enters the Elixir portal. It forwards
      # /api, /auth and /tasks to PORTAL_ENGINE_URL, serves /ws/events, and holds
      # the cable connection. The portal uses host networking, so Vite reaches
      # it via the host gateway.
      VITE_PORTAL_TARGET: ${VITE_PORTAL_TARGET:-http://host.docker.internal:4001}
      # Offline mock login passthrough (see CLAUDE.md) — lets `make test` run
      # the E2E suite against the dev stack: VITE_MOCK_LOGIN=1 make up
      VITE_MOCK_LOGIN: ${VITE_MOCK_LOGIN:-}
    extra_hosts:
      - "host.docker.internal:172.17.0.1"
    command: >
      bash -c "
        echo 'Installing dependencies...' &&
        npm install &&
        echo 'Starting Vite development server...' &&
        npm run dev -- --host 0.0.0.0 --port 4200
      "

  # Production build test. Opt-in: --profile test
  test-build:
    profiles: ["test"]
    image: node:lts
    user: "node"
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/home/node/.gitconfig:ro
      - ~/.ssh:/home/node/.ssh:ro
    environment:
      NODE_ENV: production
      TERM: xterm
    command: >
      bash -c "
        echo '🔧 Testing production build...' &&
        npm install &&
        echo '🚀 Building production bundle...' &&
        npm run build &&
        echo '✅ Build completed successfully!' &&
        ls -la dist/
      "

  # The Chrome extension (chrome/) — the Angular popup plus the MV3 background
  # worker. CORE, because it is a client of the portal beside it: it posts
  # /auth/user_login to :4001 and opens its socket on :4001/ws/events, so a
  # stack without it is missing the thing those two surfaces exist for.
  #
  # NOTHING IS SERVED, and that is not an omission. Chrome loads an extension
  # from a DIRECTORY on disk, never over HTTP, so the artefact is
  # chrome/angular/dist on the host mount and this container's whole job is to
  # keep it fresh (`npm run watch` = ng build --watch + webpack -w). Load it
  # once with "Load unpacked"; after that a popup edit needs nothing and a
  # background/content-script edit needs the reload button in
  # chrome://extensions. There is no port to point a browser at.
  #
  # NODE 20, NOT the 24 react-app runs. Angular 11 + webpack 4 need
  # --openssl-legacy-provider (already inside package.json's scripts) and do not
  # build on current Node even with it.
  chrome-ext:
    image: node:20
    # The invoking user, so angular/dist lands HOST-owned. Everything this
    # container produces is read by Chrome and rewritten by hand — `npm run
    # build` on the host, the e2e global-setup, a plain rm — and root-owned
    # output makes all three fail with EACCES inside a directory the developer
    # appears to own. UID/GID are not exported by a shell, so the Makefile
    # passes them; 1000 is the default a Linux desktop user actually has.
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./chrome:/app
      # Its own volume. The extension has its OWN package.json and a ~650MB
      # node_modules that shares node_modules_cache with nothing — the SPA's
      # tree would overwrite it and neither build would resolve.
      - chrome_node_modules:/app/node_modules
    # `npm ci` only on a cold volume: it deletes node_modules first, so running
    # it on every start would spend two minutes rebuilding an identical tree
    # before the watcher that is the point of this container ever begins.
    command: >
      bash -c "
        [ -x node_modules/.bin/ng ] || npm ci --legacy-peer-deps --no-audit --no-fund;
        npm run watch
      "

  # The extension's popup as an ordinary web page, on :4300.
  #
  # Same Angular app, served by `ng serve` instead of packed into an extension,
  # so the UI can be iterated on in a normal tab with hot reload — no
  # rebuild → chrome://extensions → reload loop. `chrome.*` does not exist
  # there, which is what `angular/src/app/providers/chrome-shim.ts` stands in
  # for; it is self-installing and inert inside a real extension.
  #
  # NOT a replacement for chrome-ext beside it. This serves a page; that one
  # keeps angular/dist built, which is the only thing Chrome can load unpacked.
  # The background service worker and content script only exist in the packed
  # form, so realtime and screen pops are the extension's job, not this one's.
  chrome-web:
    image: node:20
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ./chrome:/app
      - chrome_node_modules:/app/node_modules
    ports:
      - "4300:4300"
    command: >
      bash -c "
        [ -x node_modules/.bin/ng ] || npm ci --legacy-peer-deps --no-audit --no-fund;
        npm run serve
      "

  # The Elixir portal — the origin everything else points at. It serves the SPA
  # and /ws/events, verifies tokens over NATS, holds ONE cable connection and
  # fans out over PubSub, and forwards the mothership's own routes (/auth,
  # /api/, /tasks/) upstream so it is a complete origin on its own.
  #
  # DEV STAGE, MOUNTED SOURCE. `target: dev` stops at the toolchain and runs
  # `mix phx.server` over ./agents_demo, so an edit reloads. The release stages
  # above are what ships; this one is what you type against.
  elixir:
    build:
      context: ./agents_demo
      target: dev
    restart: unless-stopped
    # Host networking because cable (:4100), NATS (:4222) and Postgres (:5432)
    # are all published on the host's loopback,
    # and a bridged container cannot see 127.0.0.1.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORTAL_PORT:-4001}
      # Where the SPA's built assets live. Vite serves them on :4200 during
      # development; this is the fallback that makes :4001 a complete origin
      # on its own — the extension logs in against it with no Vite running.
      SPA_ROOT: /spa
      # The API. /auth, /api/ and /tasks/ are forwarded here.
      #
      # DELIBERATELY NOT `${ENGINE_URL:-${MOTHERSHIP_URL:-...}}`. Compose
      # interpolates from .env, where MOTHERSHIP_URL is the TENANT knob and is
      # normally the cloud — so that chain silently pointed this container at
      # production while the cable and the broker beside it stayed local. The
      # symptom was a login that failed for a user who exists locally, which
      # reads as broken auth rather than as the wrong host.
      #
      # This stack is only coherent when the API, the cable and the broker are
      # the same three local processes, so local is the default and one
      # explicit variable moves it.
      ENGINE_URL: ${PORTAL_ENGINE_URL:-http://127.0.0.1:5000}
      # The LISTEN half: one upstream cable connection for the whole app.
      CABLE_URL: ${PORTAL_CABLE_URL:-ws://127.0.0.1:${CABLE_PORT:-4100}/cable}
      # Mints the cable credential instead of forwarding the browser's token —
      # cable is then handed a statement this app makes about an identity the
      # node already verified, carrying the uuid and nothing else. Unset, the
      # caller's own token is forwarded, which also works. `make dev` supplies
      # this from the API container, the same value the cable verifies with.
      CABLE_SECRET_KEY: ${SECRET_KEY:-}
      # Log shipping to InfluxDB 3 — the SAME four names the node reads, so one
      # .env configures both. Empty unless set, and empty means "not
      # configured": no handler is installed and nothing is posted. The console
      # log is untouched either way; this is an addition for querying.
      # Host-networked, so the compose default `influxdb` resolves to nothing
      # here — point it at 127.0.0.1 to use the API stack's InfluxDB.
      VA_INFLUXDB_HOST: ${VA_INFLUXDB_HOST:-}
      VA_INFLUXDB_PORT: ${VA_INFLUXDB_PORT:-}
      VA_INFLUXDB_DATABASE: ${VA_INFLUXDB_DATABASE:-}
      VA_MONITOR_TOKEN: ${VA_MONITOR_TOKEN:-}
    volumes:
      - ./agents_demo:/app
      # The built SPA, read-only: the server has no reason to write into it.
      - ./dist:/spa:ro
      # Named, so a recreate does not throw away a full compile — and so the
      # host's own _build/deps (built by a different OTP on a different libc)
      # never leak into the container.
      - elixir_build:/app/_build
      - elixir_deps:/app/deps

  # va-crystal's cable, for local development. Opt-in:
  #   docker compose --profile cable up -d cable
  #
  # WHY THIS IS HERE: the portal is a CLIENT of cable, and developing against it
  # otherwise meant having a whole installed node on the box — kamailio,
  # FreeSWITCH, the SIP plane — when what the portal needs is one WebSocket
  # endpoint. Without one, CABLE_URL points at nothing and every realtime path
  # quietly does not work.
  #
  # THE LEGACY IMAGE ON PURPOSE. `nirlevi/voipappz-crystal:latest` is the cheap
  # one: its entrypoint is /opt/DockerRun, which starts the node binary and
  # nothing else. The stack image supervises kamailio and FreeSWITCH beside it
  # under s6, which is what a real node needs and what a developer does not —
  # and is why this one can share a box with an installed node instead of
  # fighting it for 5060/5080/8021.
  #
  # PORT 4100, not 4000: an installed node already binds 4000 on a dev box, and
  # two cables on one port is a confusing way to find that out. Point the portal
  # at it with CABLE_URL=ws://127.0.0.1:4100/cable.
  cable:
    profiles: ["cable"]
    image: ${VA_CRYSTAL_IMAGE:-nirlevi/voipappz-crystal:latest}
    restart: unless-stopped
    # Host networking so it reaches the broker on 127.0.0.1:4222, the same way
    # the rest of this stack reaches the host.
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${CABLE_PORT:-4100}
      # SECRET_KEY MUST EQUAL THE API'S JWT SIGNING SECRET. Cable verifies user
      # tokens against it (node/realtime/app.cr) and, when it is empty, refuses
      # EVERY connection — its own log says so, but nothing else does: the node
      # starts, answers /health, and authenticates nobody. At each client that
      # presents as a socket closing before `welcome`, which is indistinguishable
      # from a dead network. Two nodes inspected on 2026-09-02 had it empty.
      #
      # NOT `${SECRET_KEY:?...}`. Compose interpolates the WHOLE file on every
      # invocation, before it looks at profiles — so a required-variable guard
      # here is not scoped to this service: it aborts `make dev`, `make down`,
      # everything, over a service that was never being started. The loud check
      # lives in `make cable` instead, which is the only thing that starts this.
      SECRET_KEY: ${SECRET_KEY:-}
      # The broker carries the event streams cable relays. CREDENTIALS ARE
      # REQUIRED: va-nats rejects anonymous clients with 'Authorization
      # Violation', which the node retries ten times and then downgrades to a
      # warning — it keeps running with realtime state degraded rather than
      # failing, so an unauthenticated broker looks like a working cable that
      # never delivers anything. `make cable` lifts the real URL out of the API
      # container and rewrites the host, so no secret lands in this file.
      NATS_URL: ${NATS_URL:-nats://127.0.0.1:4222}
      # The API this cable belongs to. Left unset the node defaults to
      # https://cloud.voipappz.io — i.e. a local container talking to
      # production — so it is set explicitly to the local API (va-app on :5000).
      # Scoped to the cable for the same reason ENGINE_URL is scoped on the
      # portal: .env's MOTHERSHIP_URL is the tenant Vite proxies to, not the
      # API this local node belongs to.
      #
      # THE NODE DOES NOT AUTHENTICATE HERE. Every call it makes is identified
      # by NODE_UUID alone (`GET #{API_URL}/switch/api/crystal/...`) — there is
      # no account, token or basic-auth path anywhere in va-crystal's source.
      # So this server only answers if NODE_UUID names a node registered on it.
      API_URL: ${CABLE_API_URL:-http://127.0.0.1:5000}
      # A stable dev identity. Not registered with the API — this is a cable
      # endpoint for a developer, not a node claiming to be a switch.
      NODE_UUID: ${CABLE_NODE_UUID:-00000000-0000-0000-0000-0000000cab1e}
      # Debug prints payloads, which carry caller and destination numbers. Fine
      # locally, and the reason production sets Warn.
      CABLE_LOG_LEVEL: ${CABLE_LOG_LEVEL:-Debug}
      # The login pipeline: Chrome -> Elixir -> THIS -> Ruby API. Off by default
      # in va-crystal because it is a new inbound surface on every node; on here
      # because fronting the API over cable is the whole point of the local
      # stack. See CLAUDE.md "The login pipeline".
      CABLE_API_PROXY: ${CABLE_API_PROXY:-1}
      # LICENCE, NOT SECURITY. The binary reads both of these at CONST INIT
      # (license/license.cr:490,502) and raises if either is missing, so the
      # container crash-loops before it ever binds a port — with a message about
      # a licence, which reads like an entitlement problem rather than a missing
      # dev variable. Enforcement itself is opt-in (LICENSE_ENFORCE=1,
      # node.cr:143) and stays off here, so the VALUES are never checked against
      # anything: any non-empty string boots. These placeholders are deliberately
      # not a real node's keys — copying those in would make a developer's
      # laptop able to mint licences.
      LICENSE_JWT_SECRET: ${LICENSE_JWT_SECRET:-dev-not-a-secret}
      LICENSE_ENCRYPTION_KEY: ${LICENSE_ENCRYPTION_KEY:-dev-not-a-secret}
      # Also read at const init, and also fatal when missing. /opt/va.yaml is
      # the path every script in va-crystal uses, so keeping it here means a
      # real node's file can be swapped in by changing the mount alone.
      VA_PATH: /opt/va.yaml
      # There is no FreeSWITCH in this image, but the ESL event consumer starts
      # unconditionally and RAISES when this is unset (event_subscriber.cr:42,
      # "no default") — killing the process before Kemal binds. The value is
      # never used: the consumer cannot resolve `freeswitch` either, and logs a
      # reconnect warning instead of dying. ClueCon is FreeSWITCH's own default,
      # i.e. deliberately not a secret.
      FREESWITCH_PASSWORD: ${FREESWITCH_PASSWORD:-ClueCon}
      # Extra CA trust for the ApiProxy relay's HTTPS to API_URL. The image's
      # ca-certificates predates ISRG Root YE, so a customer API on a newer
      # Let's Encrypt chain (and one that serves only its leaf) fails TLS with
      # OpenSSL::SSL::Error — which the channel maps to a 502 the login reads as
      # "server down". This bundle = the image's own CAs + Root YE + the YE2
      # intermediate. Unset by default; the real fix is bumping ca-certificates
      # in the image, but this unblocks a customer host without a rebuild.
      SSL_CERT_FILE: ${CABLE_SSL_CERT_FILE:-}
    volumes:
      # Read-only: the node has no business rewriting a developer's config, and
      # a container that mutates a repo file is a confusing thing to debug.
      - ./config/cable/va.yaml:/opt/va.yaml:ro
      # The CA bundle SSL_CERT_FILE points at, when set. Read-only for the same
      # reason.
      - ./config/cable/ca-bundle.pem:/opt/ca-bundle.pem:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${CABLE_PORT:-4100}/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Playwright E2E (browsers preinstalled). Opt-in: --profile test
  # Drives the app on the host network (make up / make dev must be running,
  # or point PLAYWRIGHT_BASE_URL at any deployed origin).
  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    network_mode: host
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
    environment:
      PLAYWRIGHT_BASE_URL: ${PLAYWRIGHT_BASE_URL:-http://localhost:4200}
    command: >
      bash -c "
        npm install --loglevel=error --no-audit --no-fund &&
        npx playwright test
      "

  # Production image (build + run). Opt-in: --profile prod
  # Heavy build (Vite + an Elixir release). Behind a profile so a build failure
  # can never break the core dev stack — it is only built/run when you ask.
  production:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.production
    # One process serves everything on PORT: the SPA out of /app/dist, the
    # forwarded /auth + /api routes, and /ws/events — the same process Kamal
    # runs in prod (config/deploy.yml, app_port 3000).
    ports:
      - "8000:3000"
    environment:
      PORT: 3000
      # The API. Forwarded routes go here, and it is the issuer whose tokens
      # are verified over NATS.
      ENGINE_URL: ${ENGINE_URL:-${MOTHERSHIP_URL:-https://cloud.voipappz.io}}
      CABLE_URL: ${CABLE_URL:-}
      CABLE_SECRET_KEY: ${SECRET_KEY:-}
      NATS_URL: ${NATS_URL:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      DATABASE_URL: ${DATABASE_URL:-}
    # No container healthcheck: the image has no curl (in prod, kamal-proxy
    # probes /health/alive externally — config/deploy.yml). Verify locally:
    #   curl localhost:8000/health/alive

volumes:
  elixir_build:
  elixir_deps:
  node_modules_cache:
  chrome_node_modules:
