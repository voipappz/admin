# Kamal deployment configuration for VoipAppZ (React SPA + Elixir portal).
#
# Mirrors docker-compose.yml 1:1 — two roles built from the SAME image,
# deployed together by `kamal deploy`:
#   - web: serves /app/dist (React) + dispatches /apps/* on port 3000
#          (kamal-proxy fronts this at appcc3.freetelecom.net)
#   - pdf: runs pdf-service/server.ts on port 8001 (internal-only,
#          reachable from web at http://voipappz-pdf:8001)
#
# Kamal names role containers <service>-<role>-<image-hash>, which
# changes every deploy. We give the pdf role a stable network alias
# (`voipappz-pdf`) via `options.network-alias` so web can address it
# by a bare hostname — same way docker-compose service names work.

service: voipappz

image: nirlevi/bots

# Boot wait. This was written for Deno (~3-5s to subscribe before it bound the
# port). The portal is an Elixir release now and starts slower and less
# predictably: it runs migrations, warms Mnesia and starts the agent
# supervisors before the endpoint binds, and a cold image on a busy host is the
# slow case that matters. 60s was already the number chosen because 30 "cut it
# too close"; the same reasoning applied to a heavier boot gives more headroom.
#
# Too LOW is the expensive mistake here, not too high: `stop_first: true` has
# already taken the old container down, so a timeout is downtime plus a
# rollback, while an unused margin costs nothing.
deploy_timeout: 180

servers:
  web:
    hosts:
      - 212.199.160.156
    # Runtime secrets live on the host in /etc/voipappz/secrets.env, mounted
    # via --env-file. Place that file out-of-band (scp from your laptop). It
    # is NOT managed by Kamal — that way real secrets never appear in this
    # repo, in CI, or in .kamal/secrets.
    options:
      env-file: /etc/voipappz/secrets.env

# Persist the embedded Dashboard event store across container replacements.
volumes:
  - "voipappz-events:/data"

builder:
  arch: amd64
  dockerfile: Dockerfile.production
  # VITE_* values are baked into the React bundle at build time. They are
  # PUBLIC by design (anon keys ship in every user's browser), so it is safe
  # to pull them from CI env / .kamal/secrets.
  args:
    # Version stamp shown in the app footer. Format: YYYY.MM.DD-<short-sha>
    # so multiple deploys on the same day are still distinguishable.
    VITE_APP_VERSION: <%= "#{Time.now.strftime('%Y.%m.%d')}-#{`git rev-parse --short HEAD`.strip}" %>
    # The commit this image was built from, surfaced at /release/info and on
    # the release page. Same ERB shell-out as the line above.
    RELEASE_SHA: <%= `git rev-parse --short HEAD`.strip %>

proxy:
  ssl: false
  hosts:
    - 212.199.160.156
    - appcc3.freetelecom.net
  app_port: 3000
  healthcheck:
    # READY, not alive, and not the /health report.
    #
    # `/health/alive` answers 200 for as long as the BEAM responds, so a node
    # that booted but cannot serve passes it — agents_demo/CLAUDE.md states the
    # rule outright: "The deploy gate is /health/ready, not /health/alive."
    #
    # `/health` is the dependency REPORT the SPA's status dot polls. It answers
    # 200 with {"status":"degraded"} when a transport is missing, so gating on
    # it accepts a portal with, say, no cable — a 200 body that says "not
    # really". Only /health/ready turns not-ready into a non-2xx.
    #
    # No auth and no content negotiation on any of them — a probe that sends no
    # Accept header must not be answered 406 and read as an unhealthy node.
    path: /health/ready
    interval: 3
    timeout: 5

registry:
  username: nirlevi
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    PORT: 3000
    # DENO_ENV, STATIC_DIR, EVENT_STORE_PATH, NATS_CDR_SUBJECTS and
    # NATS_RECONCILE_SECONDS were removed with the Deno BFF that read them —
    # its DuckDB event store and CDR reconciler went with it, and the Elixir
    # portal reads none of the five. check-portal-contract.sh had been naming
    # them as dead config; it can now be believed when it names the next one.

ssh:
  user: root
  port: 2228
  keys: ["~/.ssh/kamal_deploy"]
