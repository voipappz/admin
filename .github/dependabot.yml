version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The app stays on MUI 7 / MUI X 8 until a planned migration: the 9.x
    # majors remove icon paths and change APIs across hundreds of files, so a
    # bot PR for them can only fail CI (#7). Minor and patch updates still come.
    # TypeScript 7 fails lint until typescript-eslint supports it (#34), and
    # @vitejs/plugin-react 6 needs Vite 8 while the app is on Vite 6 (#33).
    ignore:
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per ecosystem cluster instead of thirty. A lockfile bump that
      # touches twelve @mui packages is one review, not twelve.
      mui:
        patterns: ["@mui/*", "@emotion/*"]
      react:
        patterns: ["react", "react-dom", "react-router*", "@remix-run/*"]
      testing:
        patterns: ["@playwright/*", "playwright", "vitest", "@vitest/*", "@testing-library/*"]
      dev-minor:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
