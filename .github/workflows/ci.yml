name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The real-mothership job installs a whole stack and takes ~30 minutes, so it
  # is asked for rather than paid for on every push — the same opt-in shape
  # va-crystal uses for its heavy jobs. `make act` stays runnable because of it.
  workflow_dispatch:

jobs:
  web:
    name: Frontend (lint + unit + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      # The module generator must keep producing modules that pass their own
      # scaffolded test out of the box.
      - name: Module scaffolding round-trip
        run: |
          node scripts/new-module.mjs CiSmoke
          npx vitest run --configLoader runner src/services/ciSmokeApi.test.js
          rm -rf src/components/CiSmoke src/services/ciSmokeApi.js src/services/ciSmokeApi.test.js

  portal:
    name: Elixir portal (compile + tests)
    runs-on: ubuntu-latest
    # The portal verifies tokens and persists conversations, so its tests need
    # a real Postgres. Same major as production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        # Published on 5434, not 5432, so `make act-portal` runs on a
        # developer box that already has a Postgres on 5432 (the mothership's).
        # GitHub's own runners have nothing on either, so this only ever helps.
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: 5434
    defaults:
      run:
        working-directory: agents_demo
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      - uses: actions/cache@v4
        with:
          path: |
            agents_demo/deps
            agents_demo/_build
          key: mix-${{ runner.os }}-${{ hashFiles('agents_demo/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      # --warnings-as-errors here and not in the app: a warning that reaches
      # main is a warning nobody reads again.
      - run: mix compile --warnings-as-errors
      - run: mix test

  e2e:
    name: E2E smoke (mock login → dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build with the offline mock login
        run: VITE_MOCK_LOGIN=1 npm run build
      - name: Serve + run the smoke spec
        run: |
          npx vite preview --port 4200 &
          npx wait-on -t 30000 http://localhost:4200
          PLAYWRIGHT_BASE_URL=http://localhost:4200 npx playwright test tests/smoke.spec.ts

  # The e2e job above builds with VITE_MOCK_LOGIN=1: any email, OTP 123456, no
  # backend. It cannot catch a changed /auth/login contract, a forwarder that
  # stops forwarding, or a token this app mints and the API rejects — all of
  # which ship green today. This job closes that hole the way the mothership
  # proves the chrome extension: install the real thing with its own PUBLIC
  # INSTALLER on a clean runner, onboard it, and sign in for real.
  #
  # Invocation copied from mothership .github/workflows/ci.yml `health-check`.
  # Pushes cannot receive the registry secrets on forked PRs, and the install
  # is slow, so this is workflow_dispatch only.
  mothership-e2e:
    name: clean install · real mothership login
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The stack under test is the mothership's own checkout, exactly as its
      # health-check job uses ${{ github.workspace }} for its own.
      - name: Fetch the mothership
        run: git clone --depth 1 https://github.com/voipappz/mothership /tmp/mothership

      # THE INSTALLER, not a CLI: this is the command an operator runs, driven
      # THROUGH A REAL TERMINAL by the mothership's own expect script, so a
      # missing or reworded prompt fails here rather than silently.
      - name: Install the mothership with the public installer
        env:
          VA_STACK_DIR: /tmp/mothership
          INSTALL_DIR: /opt/voipappz
          DOMAIN: mothership.ci.example
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ADMIN_EMAIL: ci@mothership.ci.example
          ADMIN_PASSWORD: Vpz-ci-${{ github.run_id }}
        shell: bash -eo pipefail {0}
        run: |
          sudo apt-get install -y -qq expect >/dev/null
          cd /tmp/mothership
          expect tests/tty-install.exp installer/install.sh 2>&1 | tee /tmp/install.log

      - name: Every app-profile service is running
        run: |
          cd /opt/voipappz
          expected=$(sh scripts/compose-images.sh app | wc -l)
          sudo docker compose ps --status running --format '{{.Service}}' | tee /tmp/running
          test "$(wc -l < /tmp/running)" -ge "$((expected - 2))"   # createbuckets and db-init exit by design

      # Onboarding is idempotent and prints the extension user as RESULT_USER_*.
      - name: Onboard, and take the credential it prints
        id: onboard
        run: |
          cd /opt/voipappz
          sudo make onboard | tee /tmp/onboard.log
          EMAIL=$(sed -n 's/^RESULT_USER_EMAIL=//p' /tmp/onboard.log | head -1)
          PASS=$(sed -n 's/^RESULT_USER_PASSWORD=//p' /tmp/onboard.log | head -1)
          test -n "$EMAIL" && test -n "$PASS"
          echo "::add-mask::$PASS"
          echo "email=$EMAIL" >> "$GITHUB_OUTPUT"
          echo "password=$PASS" >> "$GITHUB_OUTPUT"

      # The PRODUCTION image, not `vite preview`: the app reaches the API
      # same-origin through the portal's forwarder, so previewing the bundle
      # alone would test a path production never takes.
      - name: Build and run the production image against that install
        run: |
          docker build -f Dockerfile.production -t voipappz-app:ci .
          docker run -d --name app --network host \
            -e PORT=4200 -e ENGINE_URL=http://127.0.0.1:5000 voipappz-app:ci
          npx wait-on -t 60000 http://localhost:4200/health/alive

      - run: npx playwright install --with-deps chromium

      - name: Sign in for real
        env:
          MOTHERSHIP_E2E_EMAIL: ${{ steps.onboard.outputs.email }}
          MOTHERSHIP_E2E_PASSWORD: ${{ steps.onboard.outputs.password }}
        run: PLAYWRIGHT_BASE_URL=http://localhost:4200 npx playwright test tests/mothership-login.spec.ts

      - name: Why it failed (logs from both sides)
        if: failure()
        run: |
          docker logs --tail 100 app || true
          cd /opt/voipappz 2>/dev/null || exit 0
          sudo docker compose ps -a || true
          for s in postgres db-init web; do echo "===== $s"; sudo docker compose logs --no-color --tail 80 "$s" || true; done

  # The relay direction, through the REAL chain: a NATS publish into a real
  # va-crystal node, the real production portal image, and the real Chrome
  # extension — asserted on /ws/events and on the tab that opens. No
  # mothership and no FreeSWITCH: the node serves cable without either, and
  # the only thing on trial is Elixir → cable and Chrome → Elixir, including
  # what happens when the node or the portal restarts. Contract and scenario
  # numbers: docs/cable-events-spec.md. Locally: `make act-cable`.
  #
  # The node image is `va-crystal-cable:latest`, built from va-crystal's
  # source. On this runner it has to come from a registry — set the
  # VA_CRYSTAL_IMAGE repository variable to its registry-qualified name (the
  # login below runs where the Hub secret exists); `make act-cable` runs with
  # an empty env file and the image already on the box.
  cable-events:
    name: NATS → va-crystal → Elixir → Chrome (real chain)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VA_CRYSTAL_IMAGE: ${{ vars.VA_CRYSTAL_IMAGE || 'va-crystal-cable:latest' }}
      COMPOSE: docker compose -f tests/cable-events/docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Docker Hub login (only where the secret exists)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      # Fail here, with the reason, rather than in the middle of `compose up`.
      - name: The node image is available
        run: |
          docker image inspect "$VA_CRYSTAL_IMAGE" >/dev/null 2>&1 || docker pull "$VA_CRYSTAL_IMAGE" || {
            echo "::error::cannot get $VA_CRYSTAL_IMAGE — it is private: set DOCKERHUB_USERNAME/DOCKERHUB_TOKEN, or point VA_CRYSTAL_IMAGE at an image this runner has"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the stack (broker, node, production portal image)
        run: $COMPOSE up -d --build
      # Readiness is PROVEN: relay confirmed by the node, and one /ws/events
      # upgrade accepted — i.e. this node image knows the `verify` action. An
      # image that predates it fails here by name, not forty assertions later.
      - name: Wait until the chain is real
        run: tests/cable-events/ready.sh
      - name: Elixir → cable, and the screen-pop contract (A, C)
        run: CABLE_EVENTS=1 npx playwright test tests/cable-events.spec.ts --grep-invert "A4" --workers=1
      # A4 is a KNOWN NODE DEFECT (see the scenario's comment): after a node
      # restart the streams the portal re-subscribes are confirmed and never
      # delivered. Non-blocking until va-crystal fixes it, but still run, so the
      # day it passes is visible and a regression elsewhere cannot hide in it.
      - name: A4 node restart recovery (known node defect, non-blocking)
        continue-on-error: true
        run: CABLE_EVENTS=1 npx playwright test tests/cable-events.spec.ts --grep "A4" --workers=1
      # The extension: Angular 11 builds on Node 20, so switch for this half.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the extension
        working-directory: chrome
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          NODE_OPTIONS=--openssl-legacy-provider npm run build
      - name: Install Chromium for the extension suite
        working-directory: chrome
        run: npx playwright install --with-deps chromium
      - name: Chrome → Elixir with the real extension (B)
        working-directory: chrome
        run: CABLE_EVENTS=1 npx playwright test portal-receive --workers=1
      - name: Why it failed (both sides of the cable)
        if: failure()
        run: |
          curl -s localhost:14001/health || true; echo
          curl -s localhost:14001/metrics | grep screen_pop || true
          $COMPOSE logs --no-color --tail 150 cable portal || true
      - name: Tear down
        if: always()
        run: $COMPOSE down -v --remove-orphans || true

  prod-image:
    name: Production image (build + boot + surface probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The exact artifact Kamal deploys: the Vite build plus the Phoenix
      # release in one image.
      - name: Build Dockerfile.production
        run: docker build -f Dockerfile.production -t voipappz-app:ci .
      - name: Boot and probe every surface
        run: |
          docker run -d --name app -p 3000:3000 -e PORT=3000 voipappz-app:ci
          for i in $(seq 1 30); do
            curl -sf localhost:3000/health/alive > /dev/null 2>&1 && break
            sleep 1
          done
          probe() {  # path, expected, extra curl args...
            local path="$1" expected="$2"; shift 2
            code=$(curl -s -o /dev/null -w '%{http_code}' "$@" "localhost:3000$path")
            if [ "$code" = "$expected" ]; then echo "  ✓ $path → $code"
            else echo "  ✗ $path → $code (expected $expected)"; docker logs app | tail -20; exit 1; fi
          }
          probe /              200                    # the SPA index
          probe /health/alive  200
          probe /health/ready  200
          # ENGINE_URL is unset in this container, so the forwarder is inert and
          # the router owns the path. Proves the plug does not swallow it.
          probe /auth/user_login 404 -X POST -H 'content-type: application/json' -d '{}'
          docker rm -f app
