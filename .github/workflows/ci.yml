name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portal:
    name: Elixir portal (compile + tests)
    runs-on: ubuntu-24.04
    # OTP 27 is supported on Ubuntu 24.04 by setup-beam. Pinning the runner
    # avoids act's stale ubuntu-latest → ubuntu20 mapping.
    # No database service. The portal has no Repo and no Ecto — every store is
    # Mnesia (`Connectix.Mnesia`, "the replacement for Ecto/Repo"), which lives
    # in the test's own temp directory. A Postgres was started for these tests
    # long after the last query went away.
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: connectix
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      - uses: actions/cache@v4
        with:
          path: |
            connectix/deps
            connectix/_build
          key: mix-${{ runner.os }}-${{ hashFiles('connectix/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      # --warnings-as-errors here and not in the app: a warning that reaches
      # main is a warning nobody reads again.
      - run: mix compile --warnings-as-errors
      - run: mix test

  # Many-at-once concurrency checks, tagged `:stress` and excluded from the
  # default run — `mix test` stays the fast gate, this is the slow one. Split
  # into its own job so a loaded runner cannot fail the suite everyone waits on.
  stress:
    name: Stress (concurrency)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: connectix
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      - uses: actions/cache@v4
        with:
          path: |
            connectix/deps
            connectix/_build
          key: mix-${{ runner.os }}-${{ hashFiles('connectix/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix test --only stress

  # Browser end-to-end, the replacement for the Playwright suite that left with
  # the SPA. Wallaby drives a real Chrome over chromedriver — an Elixir
  # dependency, so no Node comes back into this repo.
  browser:
    name: Browser E2E (Wallaby)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      # Flips the endpoint to `server: true` in config/test.exs. Without it
      # nothing is listening and every browser test fails to connect.
      WALLABY: "1"
    defaults:
      run:
        working-directory: connectix
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      # Debian/Ubuntu's packaged pair, so the driver matches the browser —
      # which a separately-downloaded chromedriver does not guarantee.
      - name: Install Chromium and chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser chromium-chromedriver \
            || sudo apt-get install -y --no-install-recommends chromium chromium-driver
          chromedriver --version
      - uses: actions/cache@v4
        with:
          path: |
            connectix/deps
            connectix/_build
          key: mix-${{ runner.os }}-${{ hashFiles('connectix/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix test --only wallaby

  # The exact artifact Kamal deploys: the Phoenix release alone — pure BEAM,
  # no Vite build, no Node anywhere in this image.
  prod-image:
    name: Production image (build + boot + surface probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile.production
        run: docker build -f Dockerfile.production -t voipappz-app:ci .
      - name: Boot and probe every surface
        run: |
          # SECRET_KEY_BASE or the release refuses to boot — `runtime.exs`
          # raises on it, so the container exits 1 before serving anything and
          # every probe below fails with a connection error rather than a
          # status. A throwaway value: this container is destroyed at the end
          # of the step and signs nothing anyone keeps.
          docker run -d --name app -p 3000:3000 -e PORT=3000 \
            -e SECRET_KEY_BASE="$(head -c 48 /dev/urandom | base64)" voipappz-app:ci
          for i in $(seq 1 30); do
            curl -sf localhost:3000/health/alive > /dev/null 2>&1 && break
            sleep 1
          done
          # `|| true` because this step runs under `bash -e`: a curl that cannot
          # connect exits 7 and would kill the step HERE, before the branch
          # below prints the container's logs — which is the only thing that
          # says why it did not boot. That is how a missing SECRET_KEY_BASE
          # showed up as a bare "exit code 7" for weeks.
          probe() {  # path, expected, extra curl args...
            local path="$1" expected="$2"; shift 2
            code=$(curl -s -o /dev/null -w '%{http_code}' "$@" "localhost:3000$path" || true)
            if [ "$code" = "$expected" ]; then echo "  ✓ $path → $code"
            else echo "  ✗ $path → $code (expected $expected)"; docker logs app | tail -30; exit 1; fi
          }
          # PORTAL_UI_USER/PASS are unset in this container, so Basic Auth is
          # pass-through — the LiveView welcome page answers 200 directly.
          probe /              200                    # the LiveView welcome page
          probe /health/alive  200
          probe /health/ready  200
          # ENGINE_URL is unset in this container, so the forwarder is inert and
          # the router owns the path. Proves the plug does not swallow it.
          probe /auth/user_login 404 -X POST -H 'content-type: application/json' -d '{}'
          docker rm -f app
