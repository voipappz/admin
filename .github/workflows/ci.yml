name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portal:
    name: Elixir portal (compile + tests)
    runs-on: ubuntu-24.04
    # OTP 27 is supported on Ubuntu 24.04 by setup-beam. Pinning the runner
    # avoids act's stale ubuntu-latest → ubuntu20 mapping.
    # No database service. The portal has no Repo and no Ecto — every store is
    # Mnesia (`Connectix.Mnesia`, "the replacement for Ecto/Repo"), which lives
    # in the test's own temp directory. A Postgres was started for these tests
    # long after the last query went away.
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: connectix
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      - uses: actions/cache@v4
        with:
          path: |
            connectix/deps
            connectix/_build
          key: mix-${{ runner.os }}-${{ hashFiles('connectix/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      # --warnings-as-errors here and not in the app: a warning that reaches
      # main is a warning nobody reads again.
      - run: mix compile --warnings-as-errors
      - run: mix test

  # Many-at-once concurrency checks, tagged `:stress` and excluded from the
  # default run — `mix test` stays the fast gate, this is the slow one. Split
  # into its own job so a loaded runner cannot fail the suite everyone waits on.
  stress:
    name: Stress (concurrency)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: connectix
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      - uses: actions/cache@v4
        with:
          path: |
            connectix/deps
            connectix/_build
          key: mix-${{ runner.os }}-${{ hashFiles('connectix/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix test --only stress

  # Browser end-to-end, the replacement for the Playwright suite that left with
  # the SPA. Wallaby drives a real Chrome over chromedriver — an Elixir
  # dependency, so no Node comes back into this repo.
  browser:
    name: Browser E2E (Wallaby)
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      # Flips the endpoint to `server: true` in config/test.exs. Without it
      # nothing is listening and every browser test fails to connect.
      WALLABY: "1"
    defaults:
      run:
        working-directory: connectix
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "27.3.4"
      # Debian/Ubuntu's packaged pair, so the driver matches the browser —
      # which a separately-downloaded chromedriver does not guarantee.
      - name: Install Chromium and chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends chromium-browser chromium-chromedriver \
            || sudo apt-get install -y --no-install-recommends chromium chromium-driver
          chromedriver --version
      - uses: actions/cache@v4
        with:
          path: |
            connectix/deps
            connectix/_build
          key: mix-${{ runner.os }}-${{ hashFiles('connectix/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-
      - run: mix deps.get
      - run: mix test --only wallaby

  # The Chrome extension, built by the SAME stage the release image uses, so a
  # green run here means `kamal deploy` can build it too. Its own job rather
  # than a step inside prod-image because it needs no BASE_IMAGE and no BEAM:
  # it fails in ~2 minutes on its own terms, instead of after the Elixir build.
  extension:
    name: Chrome extension (build + manifest + version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --target: build ONLY the node stage. Nothing else in this workflow
      # needs node, and nothing in the shipped image contains it.
      - name: Build the extension stage
        run: docker build -f Dockerfile.production --target extension -t connectix-extension:ci .

      - name: Take the package out of the stage
        run: |
          id=$(docker create connectix-extension:ci)
          docker cp "$id:/ext/extension-build.zip" ./extension-build.zip
          docker rm "$id" > /dev/null
          ls -l extension-build.zip

      # A zip that unpacks is not the same as an extension Chrome will load,
      # and the difference only shows in front of a user. Assert the fields
      # that make it loadable, and that the version is the PORTAL's — a zip
      # carrying its own number is how the two drifted before.
      - name: It is loadable, and it carries this portal's version
        run: |
          want=$(sed -n 's/^ *version: "\([^"]*\)".*/\1/p' connectix/mix.exs | head -1)
          test -n "$want" || { echo "::error::no version in connectix/mix.exs"; exit 1; }

          unzip -p extension-build.zip manifest.json > manifest.json
          jq empty manifest.json

          test "$(jq -r .manifest_version manifest.json)" = "3" \
            || { echo "::error::expected manifest_version 3"; exit 1; }

          for f in name version action; do
            jq -e ".$f" manifest.json > /dev/null \
              || { echo "::error::manifest missing $f"; exit 1; }
          done
          jq -e '.background.service_worker' manifest.json > /dev/null \
            || { echo "::error::manifest missing background.service_worker"; exit 1; }

          got=$(jq -r .version manifest.json)
          test "$got" = "$want" \
            || { echo "::error::extension says $got, connectix/mix.exs says $want"; exit 1; }

          # The files the manifest names must actually be in the archive. A
          # manifest that points at a service worker the build never emitted
          # loads and then does nothing.
          for f in backgroundPage.js contentPage.js index.html; do
            unzip -l extension-build.zip | grep -q " $f\$" \
              || { echo "::error::$f missing from the package"; exit 1; }
          done

          echo "ok: $(jq -r .name manifest.json) $got — same version as the portal"

      # `!env.ACT` skips this under nektos/act, which has no artifact service:
      # the step dies with "Unable to get the ACTIONS_RUNTIME_TOKEN env
      # variable" and turns a locally-green job red for a reason that does not
      # exist on a real runner. Everything that actually PROVES anything ran
      # above this line, so `make ci JOB=extension` still checks all of it.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !env.ACT }}
        with:
          name: extension-build
          path: extension-build.zip
          if-no-files-found: error

  # The exact artifact Kamal deploys: the Phoenix release alone — pure BEAM,
  # no Vite build, no Node anywhere in this image.
  prod-image:
    name: Production image (build + boot + surface probes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # BASE_IMAGE must be PULLABLE here. The Dockerfile defaults it to
      # `connectix:base`, which is a LOCAL tag on a developer's machine and
      # resolves to docker.io/library/connectix:base on a runner — a repository
      # that does not exist, so the build failed at `pull access denied`, which
      # reads as a credentials problem and is really a visibility one.
      - name: Build Dockerfile.production
        run: |
          docker build -f Dockerfile.production \
            --build-arg BASE_IMAGE=nirlevi/connectix-base:latest \
            -t voipappz-app:ci .
      - name: Boot and probe every surface
        run: |
          # SECRET_KEY_BASE or the release refuses to boot — `runtime.exs`
          # raises on it, so the container exits 1 before serving anything and
          # every probe below fails with a connection error rather than a
          # status. A throwaway value: this container is destroyed at the end
          # of the step and signs nothing anyone keeps.
          docker run -d --name app -p 3000:3000 -e PORT=3000 \
            -e SECRET_KEY_BASE="$(head -c 48 /dev/urandom | base64)" voipappz-app:ci
          for i in $(seq 1 30); do
            curl -sf localhost:3000/health/alive > /dev/null 2>&1 && break
            sleep 1
          done
          # `|| true` because this step runs under `bash -e`: a curl that cannot
          # connect exits 7 and would kill the step HERE, before the branch
          # below prints the container's logs — which is the only thing that
          # says why it did not boot. That is how a missing SECRET_KEY_BASE
          # showed up as a bare "exit code 7" for weeks.
          probe() {  # path, expected, extra curl args...
            local path="$1" expected="$2"; shift 2
            code=$(curl -s -o /dev/null -w '%{http_code}' "$@" "localhost:3000$path" || true)
            if [ "$code" = "$expected" ]; then echo "  ✓ $path → $code"
            else echo "  ✗ $path → $code (expected $expected)"; docker logs app | tail -30; exit 1; fi
          }
          # PORTAL_UI_USER/PASS are unset in this container, so Basic Auth is
          # pass-through — the LiveView welcome page answers 200 directly.
          probe /              200                    # the LiveView welcome page
          probe /health/alive  200
          probe /health/ready  200
          # ENGINE_URL is unset in this container, so the forwarder is inert and
          # the router owns the path. Proves the plug does not swallow it.
          probe /auth/user_login 404 -X POST -H 'content-type: application/json' -d '{}'

          # THE EXTENSION IS PART OF THE RELEASE, so a release that cannot
          # serve it is not a release. These three prove the node stage ran,
          # the zip survived into the release, and the routes are reachable
          # without a portal session — the same three things the post-deploy
          # hook checks against a real host.
          probe /release            200   # the release page
          probe /release/info       200   # the same facts, for machines
          probe /release/download   200   # the package itself

          want=$(sed -n 's/^ *version: "\([^"]*\)".*/\1/p' connectix/mix.exs | head -1)
          info=$(curl -s localhost:3000/release/info)
          got=$(echo "$info" | jq -r .extension_version)
          app=$(echo "$info" | jq -r .app_version)
          if [ "$got" != "$want" ] || [ "$app" != "$want" ]; then
            echo "  ✗ version drift: manifest=$got app=$app mix.exs=$want"
            echo "$info"; docker logs app | tail -30; exit 1
          fi
          echo "  ✓ extension $got matches the portal it ships with"

          # It must be a real zip, not an error page with a 200 on it.
          curl -s -o ext.zip localhost:3000/release/download
          unzip -t ext.zip > /dev/null || { echo "  ✗ /release/download is not a valid zip"; exit 1; }
          echo "  ✓ package unpacks ($(wc -c < ext.zip) bytes)"

          docker rm -f app
