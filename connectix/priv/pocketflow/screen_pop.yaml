# THE SHARED SCREEN-POP POLICY. One copy, for every customer.
#
# PocketFlow's vocabulary — a service with triggers and a graph of steps — but
# only the nodes Elixir has a deliberate executor for may appear. That is the
# whole safety property: a rule file cannot make the portal do something new,
# only decide when to do the one thing it already knows how to do. Adding an
# action means adding an executor in instruction.ex, on purpose.
#
# ## This file, and the customer's
#
# A deployment is TWO files, layered:
#
#   priv/pocketflow/screen_pop.yaml        this one. Which events pop, which
#                                          agent states count, where in a
#                                          frame the agent id lives, and the
#                                          reasoning behind each. Identical
#                                          everywhere, so a correction is made
#                                          once.
#   priv/pocketflow/customers/<name>.yaml  only what differs: that site's
#                                          subjects, its agents, its CRM URL.
#
# The second is MOUNTED at /rules/screen_pop.yaml — by kamal in production
# (a copy of the customer's file from this repo, placed on the host), by
# docker-compose locally. Not an env var naming a customer: the file that is
# mounted IS the customer, so there is nothing to keep in step with anything.
#
# The customer file wins key by key, one level deep, so naming
# `profile.record_url` does not drop `profile.unknown_caller` from here.
#
# THIS FILE CARRIES NO CUSTOMER'S DATA, deliberately. It used to be one
# customer's rule doubling as everyone's default, so a deployment that had not
# been configured signed in that customer's agents and popped at that
# customer's CRM — a wrong answer delivered confidently, which is worse than
# no answer. A portal with no customer file now refuses to sign anyone in and
# says so, which is a failure somebody notices.
#
# `SCREEN_POP_RULE=/some/other.yaml` replaces THIS file, for a test.

service_uuid: callcenter-screen-pop
service_type: screen_pop

# THE SWITCH.
#
# The portal reads FreeSWITCH's events first-hand, over the Event Socket
# (mod_event_socket, inbound mode, port 8021). No relay node and no broker sit
# between the switch and the pipeline.
#
# Two gates, in order, and they answer different questions:
#
#   events    what ARRIVES at all -- the switch sends nothing else
#   triggers  what POPS, out of what arrived
#
# `host` IS PER-CUSTOMER and lives in the customer file: it names one site's
# switch. What is shared is HOW to listen:
#
#   HEARTBEAT                 every 20 s while the connection is alive; the
#                             deadman's liveness signal, never stored or popped
#   CUSTOM callcenter::info   mod_callcenter's events -- bridge-agent-start,
#                             agent-offering, agent-state-change... -- which is
#                             the whole surface the screen pop reads
#
# Name only what is needed. Measured on a live switch, 86% of the traffic was
# CHANNEL_HANGUP_COMPLETE at 8.6KB a frame, and none of it pops anything; a
# broker wildcard delivered all of it, this list does not.
#
# `${VAR}` IS EXPANDED FROM THE ENVIRONMENT, and that is how the credential
# stays out of a file: the password is named here and stored in .env, never
# written here. Everything else is verbatim.
#
# `deadman` IS HOW LONG SILENCE IS ALLOWED TO LAST. Past it the portal alarms:
# an error in the log, `freeswitch: down` with the numbers on /health, and the
# reason pushed to Uptime Kuma. `off` disables it. Accepts `1m`, `60s`, `2h`,
# `60000ms`, or a bare number meaning seconds.
#
# THIS IS THE ONE FAILURE THAT REPORTS ITSELF AS HEALTHY. Every other check
# asks whether something is configured or connected, and a dead feed passes all
# of them: the socket is open, the producer says `{:subscribed, ...}`, /health
# is green, and not one event is arriving. A connection can die without saying
# so -- a NAT drops an established socket, there is no close frame and no
# error -- and the first person to notice is an agent mentioning that their
# screen stopped popping, some unknown number of calls later.
#
# One minute, because HEARTBEAT arrives every 20 seconds for as long as the
# connection is alive: a minute of silence is three missed heartbeats, never a
# quiet switch. A site that drops HEARTBEAT from `events` must raise this to
# match its own traffic.
freeswitch:
  port: 8021
  password: ${FREESWITCH_ESL_PASSWORD}
  events:
    - HEARTBEAT
    - CUSTOM callcenter::info
  deadman: 1m

# WHO THE SWITCH MEANS, when it names an agent.
#
# THE MAPPING THE WHOLE SCREEN POP HINGES ON -- and it lives in the CUSTOMER
# file, because it is a list of one site's people.
#
# A callcenter event never names the portal user: FreeSWITCH's `CC-Agent` --
# which the node also copies into `user_uuid` and uses as the key of the
# `state.user.<id>` stream -- is the user's `profile.powerlink_token`.
# Measured: `CC-Agent cb1b0a46...` arrived while the browser held user
# `be5bc5f0...`, and the first was that user's powerlink token.
#
# AN ENTRY WITH A PASSWORD IS ALSO A LOGIN. The portal performs
# `/auth/user_login` itself (`Portal.AuthController`) against these, so signing
# in depends on the customer file and on nothing else being reachable. The
# token it mints carries the powerlink uuid AS the identity, which is what the
# switch names the agent by -- so there is no mapping step left to get wrong.
# An entry with no password is a mapping only, and refuses to sign in rather
# than accepting anything.
#
# THE SHAPE, keyed by email or by portal uuid:
#
#   agents:
#     "agent@example.com":
#       powerlink: <the agent's powerlink uuid>
#       password: "${AGENT_PASSWORD}"
#     <portal user uuid>:
#       powerlink:
#         - <powerlink uuid>
#         - <another>
#
# A uuid key costs nothing: it is the one identity the login token carries, so
# it applies the instant the socket opens. An email key needs the user record
# first, because the JWT carries `user_uuid`, `exp` and `issues` and no
# address -- which is the very call an entry is usually written to avoid. Email
# is still worth having, because an address is what a person can write down.
#
# Ids named are ADDED to whatever the user record supplies, never used instead
# of it, so naming one user does not turn the lookup off for anyone else.
#
# NO AGENTS HERE, deliberately. A portal with no customer file signs nobody in,
# which is a failure somebody notices within a minute -- unlike inheriting
# another customer's roster, which is a failure nobody notices at all.

# WHICH EVENTS POP, in both spellings the wire uses.
#
# sessions.cr maps FreeSWITCH's callcenter actions to `user.*` names before it
# publishes a folded state frame, but a relayed raw frame keeps the original
# action. Accepting only the mapped names refused this, which the node pushes
# verbatim:
#
#   {"action":"agent-state-change","user_uuid":"cb1b0a46…",
#    "user_state":"In a queue call",
#    "meta":{"CC-Agent":"cb1b0a46…","CC-Agent-State":"In a queue call"}}
#
# ONLY THE TWO THAT MEAN "THE AGENT IS NOW ON THE CALL".
#
# The tab opens on ANSWER, never on ringing. `bridge-agent-start` is the
# callcenter bridging the caller to the agent — the answer itself — and an
# `agent-state-change` into "In a queue call" is the same fact stated as a
# state. Everything else was removed after watching a real call:
#
#   * `agent-offering` fires while the phone is still RINGING, and fires once
#     per agent the queue tries. One caller rang four agents, so four people
#     would have had a CRM tab opened for a call three of them never took.
#   * `user.ringing` is the same mistake in the mapped spelling.
#   * `user.answer` and `user.state_change` are the non-queue spellings; this
#     deployment's calls arrive as callcenter frames, and accepting both
#     spellings pops twice for one answer.
# ONE event, so one call cannot open two tabs.
#
# The dedupe key is per (event name, agent, call), so accepting two spellings
# of the same fact pops twice: `agent-offering` and `bridge-agent-start` for
# one call produced two different keys and two tabs. `agent-state-change` into
# "In a queue call" is that same fact a third time, and it carries no call id
# to dedupe against, so it is out too until the key is call-scoped rather than
# name-scoped.
#
# `bridge-agent-start` is the answer itself — the callcenter bridging caller to
# agent — and the switch emits exactly one per call per agent.
#
# THIS LIST IS ALSO THE GATE. A frame whose event/action is not named here is
# dropped by the portal before it is stored, before the agent lookup and
# before any log line (`PopRule.trigger?/1`). Add a name here to make the
# portal look at that event at all; nothing else needs to change.
triggers:
  - bridge-agent-start

# WHICH AGENT STATES COUNT AS "on a call".
#
# Empty means every state passes. Listed, an `agent-state-change` only pops
# when `user_state` (or meta CC-Agent-State) is one of these — so going Idle
# does not open a CRM tab.
#
# "Receiving" is deliberately NOT here. It is the state an agent enters while
# their phone RINGS, so it opened the tab before the call was taken — and for
# every agent the queue offered, not just the one who answered. "In a queue
# call" is the state after the bridge, which is what answering means.
# Observed states for one agent across a real call: Waiting -> Receiving ->
# In a queue call -> Waiting.
agent_states:
  - In a queue call

# HOW AN EVENT NAMES THE AGENT, in priority order.
#
# The callcenter identifies an agent by the user's `profile.powerlink_token`,
# NOT by the portal user uuid — the node copies it into `user_uuid` and keys
# `state.user.<id>` by it. Whichever of these is present is compared against
# the ids resolved for the signed-in user at connect (AgentIdentity).
agent_fields:
  - meta.CC-Agent
  - user_uuid
  - data.user_uuid

profile:
  # `record_url` IS IN THE CUSTOMER FILE. It is that site's CRM endpoint, and
  # there is no sensible default: popping an agent at somebody else's system is
  # a wrong answer delivered confidently. With none configured the portal
  # refuses to pop and logs why.
  #
  # `{phone}` and `{call_id}` are filled from the event; an absent number
  # becomes `unknown_caller` rather than being dropped, because a CRM opens a
  # blank search on an empty phone and a blank form beats a silent no-pop.
  unknown_caller: "0000"
  pop_on: answer

steps:
  - key: pop
    node: screen_pop_pop
    on: {}
